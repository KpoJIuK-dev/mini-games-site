<title>Аркада Free Fire</title>
<link rel="icon" href="assets/img/diamond.png">
<script>
(function () {
  var root = document.documentElement;
  var now = new Date();
  var byWeekday = ['c', 'a', 'b', 'c', 'd', 'a', 'b'];
  var font = /[?&]font=([abcd])/.exec(location.search);
  var term = /[?&]console=(pro|led)/.exec(location.search);
  root.dataset.font = font ? font[1] : byWeekday[now.getDay()];
  root.dataset.console = term ? term[1] : (now.getDate() % 2 ? 'led' : 'pro');
})();
</script>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/type.css">
