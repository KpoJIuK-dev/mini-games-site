<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ссылки на рулетку с призом</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: helvetica, arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    color: #27004e;
    background: #f0f2f8;
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 12px 40px; }
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 { font-size: 1.35rem; margin: 0; font-weight: 700; }
  .back {
    color: #3b00a9;
    text-decoration: none;
    font-weight: 600;
  }
  .back:hover { text-decoration: underline; }
  .panel {
    background: #fff;
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(39, 0, 78, 0.08);
  }
  .panel label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 13px;
    color: #555;
  }
  .panel input[type="url"] {
    width: 100%;
    max-width: 100%;
    padding: 10px 12px;
    border: 1px solid #dfe3e8;
    border-radius: 10px;
    font-size: 14px;
  }
  .hint { font-size: 12px; color: #777; margin-top: 8px; line-height: 1.4; }
  .prizes-links__status { font-size: 13px; margin-bottom: 12px; }
  .prizes-links__status--warn { color: #b00020; }
  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 12px;
    border: 1px solid #e4e4e8;
  }
  table {
    width: 100%;
    min-width: 0;
    border-collapse: collapse;
    background: #fff;
    font-size: 13px;
  }
  th, td {
    padding: 10px 10px;
    text-align: left;
    border-bottom: 1px solid #eef0f4;
    vertical-align: middle;
  }
  th {
    background: #5d80a6;
    color: #fff;
    font-weight: 600;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  .prizes-links__subhead td {
    background: #e8ecf4;
    font-size: 12px;
    padding: 8px 12px;
  }
  @media (max-width: 640px) {
    h1 { font-size: 1.1rem; }
    /* Таблица остаётся строками; узкий экран — горизонтальный скролл в .table-wrap */
    table { min-width: 720px; }
  }
  .prizes-links__thumb {
    width: 48px;
    height: 48px;
    object-fit: contain;
    border-radius: 8px;
    background: #f5f5f8;
    display: block;
  }
  .prizes-links__noimg { color: #aaa; }
  .prizes-links__td-actions {
    white-space: normal;
    vertical-align: top;
  }
  .prizes-links__action-stack {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: stretch;
    min-width: 7.5rem;
  }
  .prizes-links__action-stack .prizes-links__btn {
    width: 100%;
    box-sizing: border-box;
  }
  .prizes-links__btn {
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    background: linear-gradient(180deg, #de00ff 0%, #3b00a9 100%);
    color: #fff;
  }
  .prizes-links__btn--ghost {
    background: #fff;
    color: #3b00a9;
    border: 2px solid #3b00a9;
  }
  code { background: #f0f0f4; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Ссылки с закодированным id приза</h1>
    <a class="back" href="index.html">← К рулетке</a>
  </div>
  <div class="panel">
    <label for="prizes-links-base">Базовый URL страницы рулетки (куда подставляется параметр)</label>
    <input type="url" id="prizes-links-base" placeholder="https://ваш-сайт/index.html" autocomplete="off">
    <p class="hint">
      «Код win» копирует только Base64 от <code>id</code>; «Ссылка» под ним — полный URL с параметром <code>win</code> (из базового адреса выше).
    </p>
  </div>
  <p id="prizes-links-status" class="prizes-links__status" aria-live="polite">Загрузка…</p>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>ID</th>
          <th>Название</th>
          <th>Код</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="prizes-links-tbody"></tbody>
    </table>
  </div>
</div>
<script src="js/prizes-links.js?v=5"></script>
</body>
</html>
